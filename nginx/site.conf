server {
    listen 80 default_server;

    charset utf-8;

    # --- Security Headers ---
    add_header 'X-Content-Type-Options' 'nosniff' always;
    add_header 'Cross-Origin-Opener-Policy' 'unsafe-none' always;
    add_header 'Cross-Origin-Embedder-Policy' 'same-origin' always;
    add_header 'Strict-Transport-Security' 'max-age=31536000; includeSubDomains; preload' always;
    add_header 'Referrer-Policy' 'same-origin' always;
    add_header 'Permissions-Policy' 'geolocation=(self),midi=(),sync-xhr=(),microphone=(),camera=(self),magnetometer=(self),gyroscope=(),fullscreen=(self),payment=()' always;

    # --- Content Security Policy (EINZEILIG! HTTP/2 SAFE) ---
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://wb.wna24.de https://*.wna24.de https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://wb.wna24.de https://*.wna24.de; script-src-elem 'self' 'unsafe-inline' https://wb.wna24.de https://*.wna24.de; style-src 'self' 'unsafe-inline' https://wb.wna24.de https://*.wna24.de https://cdnjs.cloudflare.com; font-src 'self' data: https://wb.wna24.de https://*.wna24.de https://cdnjs.cloudflare.com; img-src 'self' data: https://wb.wna24.de https://*.wna24.de; frame-src 'self' https://wb.wna24.de https://*.wna24.de; frame-ancestors 'self'; object-src 'none';" always;

    server_tokens off;

    access_log off;
    error_log /var/log/nginx/app-error.log;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|gif|ico|svg|ttf|woff|woff2|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    location ~* \.map$ {
        default_type application/json;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Buffers ---
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_body_buffer_size 128k;
    client_max_body_size 8m;

    # --- Timeouts ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # --- GZip ---
    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types application/javascript application/json application/webmanifest application/rss+xml application/x-javascript application/xml image/svg+xml text/css text/javascript text/js text/plain text/xml;

    # --- brotli ---
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_static on;
    brotli_types application/javascript application/json text/javascript text/css image/svg+xml application/xml text/plain;

    location / {
        try_files $uri /index.html;
    }
}
