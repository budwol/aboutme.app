name: ci-e2e

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: check out repo
        uses: actions/checkout@v5

      - name: set up project
        uses: ./.github/actions/setup-project

      - name: install playwright chromium
        run: npx playwright install --with-deps chromium

      - name: install image tools
        run: sudo apt-get update && sudo apt-get install --yes imagemagick

      - name: e2e
        id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-output.log

      - name: print playwright failure context
        if: steps.e2e.outcome == 'failure'
        run: |
          if [ -f e2e-output.log ]; then
            echo "::group::e2e-output tail"
            tail -n 200 e2e-output.log
            echo "::endgroup::"
          fi

          if [ -d test-results ]; then
            echo "::group::test-results files"
            find test-results -maxdepth 3 -type f | sort
            echo "::endgroup::"
          fi

          if [ -d test-results ]; then
            find test-results -name error-context.md | while read -r file; do
              echo "::group::$file"
              sed -n '1,200p' "$file"
              echo "::endgroup::"
            done
          fi

      - name: upload playwright artifacts
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            e2e-output.log
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: fail job if e2e failed
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "Playwright failed in the previous step."
          echo "Check the grouped error-context output above or download the playwright-artifacts artifact."
          exit 1

      - name: check container security headers and CSP
        run: |
          npm run test:smoke
          docker build --pull -t aboutme-security-headers-test .
          docker run --rm -d --name aboutme-security-headers-test -p 127.0.0.1:5111:8080 aboutme-security-headers-test
          trap 'docker stop aboutme-security-headers-test' EXIT
          npm run test:security:headers
