name: ci-e2e

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: check out repo
        uses: actions/checkout@v5

      - name: set up node
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.4
          cache: npm

      - name: install deps
        run: npm ci

      - name: install playwright chromium
        run: npx playwright install --with-deps chromium

      - name: e2e
        id: e2e
        continue-on-error: true
        run: npm run test:e2e

      - name: print playwright failure context
        if: steps.e2e.outcome == 'failure'
        run: |
          if [ -d test-results ]; then
            echo "::group::test-results files"
            find test-results -maxdepth 3 -type f | sort
            echo "::endgroup::"
          fi

          if [ -d test-results ]; then
            find test-results -name error-context.md | while read -r file; do
              echo "::group::$file"
              sed -n '1,200p' "$file"
              echo "::endgroup::"
            done
          fi

      - name: upload playwright artifacts
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: fail job if e2e failed
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "Playwright failed in the previous step."
          echo "Check the grouped error-context output above or download the playwright-artifacts artifact."
          exit 1
