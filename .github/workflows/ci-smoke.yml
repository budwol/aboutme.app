name: ci-smoke

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: check out repo
        uses: actions/checkout@v5

      - name: set up project
        uses: ./.github/actions/setup-project

      - name: audit dependencies
        run: npm run test:security:audit

      - name: smoke
        run: npm run test:smoke
