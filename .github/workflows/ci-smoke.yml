name: ci-smoke

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: check out repo
        uses: actions/checkout@v5

      - name: set up node
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.4
          cache: npm

      - name: install deps
        run: npm ci

      - name: smoke
        run: npm run test:smoke
