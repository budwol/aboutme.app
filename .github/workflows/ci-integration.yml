name: ci-integration

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: check out repo
        uses: actions/checkout@v5

      - name: set up project
        uses: ./.github/actions/setup-project

      - name: integration
        run: npm run test:integration
